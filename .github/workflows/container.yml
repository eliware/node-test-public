name: Build and publish container

on:
  push:
    tags:
      - '*'

permissions:
  contents: read
  packages: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/eliware/${{ github.event.repository.name }}
          tags: |
            type=raw,value=${{ github.ref_name }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: |
            ${{ steps.meta.outputs.labels }}
            org.opencontainers.image.source=https://github.com/${{ github.repository }}


      - name: Update GitOps manifests
        env:
          GITOPS_REPO_TOKEN: ${{ secrets.GITOPS_REPO_TOKEN }}
          IMAGE_TAG: ${{ github.ref_name }}
        run: |
          test -n "$GITOPS_REPO_TOKEN"
          git clone "https://x-access-token:${GITOPS_REPO_TOKEN}@github.com/eliware/k8s-gitops.git" /tmp/k8s-gitops
          cd /tmp/k8s-gitops

          for file in \
            clusters/region-a/apps/node-test-public.yaml \
            clusters/region-b/apps/node-test-public.yaml
          do
            sed -i -E \
              "s#(ghcr.io/eliware/node-test-public:)[^[:space:]"]+#\1${IMAGE_TAG}#" \
              "$file"
          done

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add clusters/region-a/apps/node-test-public.yaml clusters/region-b/apps/node-test-public.yaml
          git diff --cached --quiet || git commit -m "Deploy node-test-public ${IMAGE_TAG}"
          git push origin main
